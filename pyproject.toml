[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "priorlock"
version = "0.1.0"
description = "A Harbor-native benchmark measuring prior-override capability in AI agents"
authors = [{name = "Muhammad Labeeb Tariq", email = "labeebjutt80@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["benchmark", "rl", "harbor", "ai", "agents", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.scripts]
priorlock = "priorlock.cli:main"

[project.urls]
Homepage = "https://phoenixlibbi.github.io/PriorLock-RL-env"
Repository = "https://github.com/phoenixlibbi/PriorLock-RL-env"
Issues = "https://github.com/phoenixlibbi/PriorLock-RL-env/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
priorlock = ["domains/**/*", "probes/calibration.json"]
