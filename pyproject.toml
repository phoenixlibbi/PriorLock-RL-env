[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "priorlock"
version = "0.1.1"
description = "PriorLock: A Domain-Agnostic Reinforcement Learning Environment for Measuring and Training Prior Override in Autonomous Agents"
authors = [{name = "Muhammad Labeeb Tariq", email = "labeebjutt80@gmail.com"}]
maintainers = [{name = "Muhammad Labeeb Tariq", email = "labeebjutt80@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["benchmark", "rl", "harbor", "ai", "agents", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]
# The RL (training) packaging. Evaluation via Harbor needs none of this.
rl = ["verifiers>=0.1.14", "datasets>=2.14"]

[project.scripts]
priorlock = "priorlock.cli:main"

# Discovered by `verifiers` as an installed environment:
#     vf-eval priorlock       /  vf.load_environment("priorlock")
[project.entry-points."verifiers.environments"]
priorlock = "priorlock.env:load_environment"

[project.urls]
Homepage = "https://phoenixlibbi.github.io/PriorLock-RL-env"
Repository = "https://github.com/phoenixlibbi/PriorLock-RL-env"
Issues = "https://github.com/phoenixlibbi/PriorLock-RL-env/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
priorlock = ["domains/**/*", "probes/calibration.json"]
