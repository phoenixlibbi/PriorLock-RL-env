name: Stage-0 gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stage0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Every archetype in the catalog must pass all 9 gates, individually, on a
  # host task it has never seen. This is what stops a broken probe merging.
  # ────────────────────────────────────────────────────────────────────────────
  catalog:
    name: catalog · all archetypes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Gate every probe archetype
        run: |
          python - <<'PY'
          import shutil, sys, tempfile
          from pathlib import Path
          from priorlock.inject import wrap_task
          from priorlock.gates import run_stage0
          from priorlock.probes import ALL_PROBES

          # a minimal synthetic host task — probes must work on ANY task
          host = Path(tempfile.mkdtemp()) / "host"
          (host / "environment" / "repo" / "data").mkdir(parents=True)
          (host / "tests").mkdir(parents=True)
          (host / "task.toml").write_text(
              'schema_version = "1.3"\n\n[task]\nname = "ci/host"\n'
              'description = "CI host task for probe gating."\n\n'
              '[environment]\nworkdir = "/app/repo"\n'
          )
          (host / "instruction.md").write_text("# CI host task\n")

          failures = []
          for probe in ALL_PROBES:
              target = Path(tempfile.mkdtemp()) / probe.id
              shutil.copytree(host, target)
              wrap_task(target, probe_ids=[probe.id])
              report = run_stage0(target, verbose=False)
              bad = [g.id for g in report.gates if not g.passed]
              mark = "PASS" if not bad else "FAIL"
              s = report.scores
              print(f"{mark}  {probe.id:<28} {probe.family:<14} "
                    f"ladder {s['stub']}/{s['bypass']}/{s['familiar']}/{s['gold']}"
                    + (f"  {bad}" if bad else ""))
              if bad:
                  failures.append((probe.id, report.to_dict()))

          print(f"\n{len(ALL_PROBES) - len(failures)}/{len(ALL_PROBES)} archetypes pass")
          for pid, data in failures:
              for gate in data["gates"]:
                  if not gate["passed"]:
                      print(f"  {pid} {gate['id']} {gate['name']}: {gate['detail']}")
          sys.exit(1 if failures else 0)
          PY

  # ────────────────────────────────────────────────────────────────────────────
  discover:
    name: discover
    runs-on: ubuntu-latest
    outputs:
      wrapped: ${{ steps.find.outputs.wrapped }}
      domains: ${{ steps.find.outputs.domains }}
      has_wrapped: ${{ steps.find.outputs.has_wrapped }}
      has_domains: ${{ steps.find.outputs.has_domains }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          SKIP = {".git", "node_modules", ".next", ".venv", "__pycache__", "trials"}
          wrapped, domains = [], []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in SKIP]
              if "priorlock.toml" in files:
                  wrapped.append(os.path.relpath(root, "."))
                  dirs[:] = []
                  continue
              if os.path.isfile(os.path.join(root, "scripts", "stage0.py")):
                  domains.append(os.path.relpath(root, "."))

          print(f"wrapped={json.dumps(sorted(wrapped))}")
          print(f"domains={json.dumps(sorted(domains))}")
          print(f"has_wrapped={'true' if wrapped else 'false'}")
          print(f"has_domains={'true' if domains else 'false'}")
          PY

  # ────────────────────────────────────────────────────────────────────────────
  wrapped:
    name: wrapped · ${{ matrix.task }}
    needs: discover
    if: needs.discover.outputs.has_wrapped == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.discover.outputs.wrapped) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Stage-0
        run: priorlock stage0 "${{ matrix.task }}"
      - name: Capture report
        if: always()
        run: priorlock stage0 "${{ matrix.task }}" --json > stage0.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage0-wrapped-${{ strategy.job-index }}
          path: stage0.json
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  domains:
    name: authored · ${{ matrix.domain }}
    needs: discover
    if: needs.discover.outputs.has_domains == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJSON(needs.discover.outputs.domains) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Stage-0
        run: priorlock stage0 "${{ matrix.domain }}"

  # ────────────────────────────────────────────────────────────────────────────
  summary:
    name: summary
    needs: [catalog, discover, wrapped, domains]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          {
            echo "### Stage-0 gate summary"
            echo ""
            echo "| suite | result |"
            echo "|---|---|"
            echo "| probe catalog | ${{ needs.catalog.result }} |"
            echo "| wrapped tasks | ${{ needs.wrapped.result }} |"
            echo "| authored domains | ${{ needs.domains.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.catalog.result }}" = "success" || exit 1
          test "${{ needs.wrapped.result }}" != "failure" || exit 1
          test "${{ needs.domains.result }}" != "failure" || exit 1
